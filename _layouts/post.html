---
layout: default
---
<article class="section narrow">
  <p class="eyebrow">{{ page.date | date: "%d %B %Y" }}</p>
  <h1>{% if page.title_sv %}<span class="lang-en">{{ page.title }}</span><span class="lang-sv">{{ page.title_sv }}</span>{% else %}{{ page.title }}{% endif %}</h1>
  {% if page.author %}<p class="admin-note">By {{ page.author }}</p>{% endif %}
  <div class="post-content">{{ content }}</div>
  <p><a class="text-link" href="{{ '/news/' | relative_url }}">← Back to news</a></p>
</article>
